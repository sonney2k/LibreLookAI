<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Tags · Variant C Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tags-shared.jsx"></script>
<script type="text/babel" src="tags-variant-c.jsx"></script>
<style>
  html,body{margin:0;height:100%;background:#0E120D;display:flex;align-items:center;justify-content:center;gap:32px;padding:40px;font-family:'Plus Jakarta Sans',sans-serif;flex-wrap:wrap}
  ::-webkit-scrollbar{display:none}
  .lbl{color:#9ABF8A;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;text-align:center}
  .col{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<div class="col"><div class="lbl">Light · Green</div><div id="c1"></div></div>
<div class="col"><div class="lbl">Light · Sand</div><div id="c2"></div></div>
<div class="col"><div class="lbl">Dark · Green</div><div id="c3"></div></div>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('c1')).render(<VariantCTags theme="green-light"/>);
ReactDOM.createRoot(document.getElementById('c2')).render(<VariantCTags theme="sand-light"/>);
ReactDOM.createRoot(document.getElementById('c3')).render(<VariantCTags theme="green-dark"/>);
</script>
</body>
</html>
