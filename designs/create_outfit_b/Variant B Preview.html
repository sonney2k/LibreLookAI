<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Outfit · Variant B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="compose-shared.jsx"></script>
<script type="text/babel" src="compose-variant-b.jsx"></script>
<style>
  html,body{margin:0;height:100%;background:#0E120D;display:flex;align-items:center;justify-content:center;gap:24px;padding:40px;font-family:'Plus Jakarta Sans',sans-serif;flex-wrap:wrap}
  ::-webkit-scrollbar{display:none}
  .label{color:#9ABF8A;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const App = () => (
  <>
    <div><div className="label">Blank</div><div id="b1"></div></div>
    <div><div className="label">Pre-seeded</div><div id="b2"></div></div>
    <div><div className="label">AI suggestion</div><div id="b3"></div></div>
  </>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
ReactDOM.createRoot(document.getElementById('b1') || (() => {const d=document.createElement('div');document.body.appendChild(d);return d;})()).render(<VariantB theme="green-light" density="comfortable" seed="blank"/>);
</script>
<script type="text/babel">
setTimeout(() => {
  ReactDOM.createRoot(document.getElementById('b2')).render(<VariantB theme="green-light" density="comfortable" seed="preseeded"/>);
  ReactDOM.createRoot(document.getElementById('b3')).render(<VariantB theme="green-light" density="comfortable" seed="ai"/>);
}, 100);
</script>
</body>
</html>
