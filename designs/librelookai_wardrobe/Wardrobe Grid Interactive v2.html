// ── Main app ─────────────────────────────────────────────────────────────────
const WardrobeApp = ({ theme, isOffline, multiCloset }) => {
  const t = THEMES[theme];
  const isDark = theme.includes("dark");
  const swatches = SWATCHES[isDark ? "dark" : "light"];

  // Grid zoom
  const [cellSize, setCellSize] = React.useState(120);
  const gridRef = React.useRef(null);
  const pinchRef = React.useRef(null);

  React.useEffect(() => {
    const el = gridRef.current;
    if (!el) return;
    const onTouchStart = (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchRef.current = { dist: Math.hypot(dx, dy), size: cellSize };
      }
    };
    const onTouchMove = (e) => {
      if (e.touches.length === 2 && pinchRef.current) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        pinchRef.current.size *= (dist / pinchRef.current.dist);
        pinchRef.current.dist = dist;
        setCellSize(Math.max(56, Math.min(320, pinchRef.current.size)));
      }
    };
    const onTouchEnd = () => { pinchRef.current = null; };
    const onWheel = (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        setCellSize(s => Math.max(56, Math.min(320, s * (e.deltaY > 0 ? 0.93 : 1.08))));
      }
    };
    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: false });
    el.addEventListener('touchend', onTouchEnd);
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => {
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
      el.removeEventListener('touchend', onTouchEnd);
      el.removeEventListener('wheel', onWheel);
    };
  }, [cellSize]);

  const getCols = () => Math.max(1, Math.min(6, Math.floor(370 / cellSize)));

  // Filters — v1 pattern: pending edits in sheet, apply commits to applied
  const [filterOpen, setFilterOpen]       = React.useState(false);
  const [pendingFilters, setPendingFilters] = React.useState({});  // dim → Set
  const [appliedFilters, setAppliedFilters] = React.useState({});
  const [openDim, setOpenDim]             = React.useState("Category");

  const togglePending = (dim, val) => {
    setPendingFilters(prev => {
      const next = { ...prev };
      const s = new Set(next[dim] || []);
      s.has(val) ? s.delete(val) : s.add(val);
      next[dim] = s;
      return next;
    });
  };
  const openSheet = () => {
    setPendingFilters(Object.fromEntries(
      Object.entries(appliedFilters).map(([k,v])=>[k, new Set(v)])
    ));
    setFilterOpen(true);
  };
  const applyFilters = () => {
    setAppliedFilters(Object.fromEntries(
      Object.entries(pendingFilters).map(([k,v])=>[k, new Set(v)])
    ));
    setFilterOpen(false);
  };
  const clearFilters = () => {
    setAppliedFilters({});
    setPendingFilters({});
    setFilterOpen(false);
  };
  const removeApplied = (dim, val) => {
    setAppliedFilters(prev => {
      const next = { ...prev };
      const s = new Set(next[dim] || []);
      s.delete(val);
      if (s.size === 0) delete next[dim]; else next[dim] = s;
      return next;
    });
  };

  // Sort
  const [sortBy, setSortBy] = React.useState("DATE_DESC");
  const [sortOpen, setSortOpen] = React.useState(false);

  // Selection
  const [selected, setSelected] = React.useState(new Set());
  const selectionMode = selected.size > 0;

  // Simulate sync progress
  const [syncProgress, setSyncProgress] = React.useState(null); // {done, total}

  // Toast
  const [toast, setToast] = React.useState(null);
  const showToast = msg => setToast(msg);

  // FAB speed-dial open (selection mode)
  const [fabOpen, setFabOpen] = React.useState(false);

  // Location picker dropdown
  const [locationOpen, setLocationOpen] = React.useState(false);
  const [activeLocation, setActiveLocation] = React.useState("Main");
  const LOCATIONS = multiCloset ? ["Main", "Office", "Storage"] : ["Main"];

  // Derived: filtered + sorted items
  const activeFilters = Object.entries(appliedFilters).filter(([,v]) => v.size > 0);
  const filteredImages = React.useMemo(() => {
    if (activeFilters.length === 0) return ALL_ITEMS;
    return ALL_ITEMS.filter(img =>
      activeFilters.every(([dim, vals]) => {
        if (dim === "Category")    return vals.has(img.category);
        if (dim === "Uses")        return img.uses.some(u => vals.has(u));
        if (dim === "Seasonality") return img.seasonality.some(s => vals.has(s));
        if (dim === "Colors")      return img.colors.some(c => vals.has(c));
        return true;
      })
    );
  }, [appliedFilters]);

  const displayedImages = React.useMemo(() => {
    switch (sortBy) {
      case "DATE_ASC":   return [...filteredImages].reverse();
      case "POPULARITY": return [...filteredImages].sort((a,b) => (b.wornCount||0)-(a.wornCount||0));
      case "TYPE":       return [...filteredImages].sort((a,b) => a.type.localeCompare(b.type));
      case "CATEGORY":   return [...filteredImages].sort((a,b) => a.category.localeCompare(b.category));
      default:           return filteredImages;
    }
  }, [filteredImages, sortBy]);

  const appliedCount = activeFilters.reduce((n,[,s])=>n+s.size,0);
  const hasFilter = appliedCount > 0;

  const toggleItem = id => {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const cols = getCols();

  return (
    <div onClick={() => { sortOpen && setSortOpen(false); locationOpen && setLocationOpen(false); fabOpen && setFabOpen(false); }}
      style={{ width:390, height:"100vh", maxHeight:844, background:t.bg,
        fontFamily:"'Plus Jakarta Sans',sans-serif", color:t.text,
        display:"flex", flexDirection:"column", position:"relative", overflow:"hidden",
        borderRadius:36,
        boxShadow: isDark
          ? "0 0 0 1px #304028, 0 20px 60px rgba(0,0,0,0.6)"
          : "0 0 0 1px #C4D4BA, 0 16px 60px rgba(78,120,68,0.18)" }}>

      {/* ── Status bar ── */}
      <div style={{ height:44, background:t.surface, flexShrink:0,
        display:"flex", alignItems:"center", justifyContent:"space-between",
        padding:"0 24px", borderBottom:`1px solid ${t.divider}` }}>
        <span style={{ fontSize:13, fontWeight:600 }}>9:41</span>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          {isOffline && (
            <div style={{ display:"flex", alignItems:"center", gap:3,
              background:t.error+"22", borderRadius:10, padding:"2px 7px" }}>
              <Ico name="cloudOff" size={12} color={t.error}/>
              <span style={{ fontSize:10, fontWeight:600, color:t.error }}>Offline</span>
            </div>
          )}
          <svg width={18} height={10} viewBox="0 0 18 10">
            {[0,1,2,3].map(i=><rect key={i} x={i*5} y={10-(i+1)*2.5} width={3.5} height={(i+1)*2.5} rx={1} fill={t.text} opacity={.3+i*.2}/>)}
          </svg>
          <svg width={22} height={12} viewBox="0 0 24 12">
            <rect x={0} y={1} width={21} height={10} rx={2.5} stroke={t.text} strokeWidth={1.2} fill="none" opacity={.5}/>
            <rect x={21.5} y={3.5} width={2} height={5} rx={1} fill={t.text} opacity={.4}/>
            <rect x={1.5} y={2.5} width={16} height={7} rx={1.5} fill={t.text} opacity={.75}/>
          </svg>
        </div>
      </div>

      {/* ── AppScreenHeader ── */}
      <div style={{ background:t.surface, padding:"8px 4px 8px 16px", flexShrink:0,
        display:"flex", alignItems:"center", gap:4,
        borderBottom:`1px solid ${t.divider}` }}>
        {/* Title */}
        <span style={{ fontSize:20, fontWeight:700, flex:1 }}>Wardrobe</span>

        {/* Location button (closet picker) */}
        <div style={{ position:"relative" }}>
          <div onClick={e => { e.stopPropagation(); setLocationOpen(o=>!o); }}
            style={{ display:"flex", alignItems:"center", gap:3,
              padding:"6px 10px", borderRadius:20, cursor:"pointer",
              background: t.chipBg, border:`1px solid ${t.border}` }}>
            <Ico name="place" size={14} color={t.textMid}/>
            <span style={{ fontSize:12, fontWeight:500, color:t.textMid }}>{activeLocation}</span>
            <svg width={14} height={14} viewBox="0 0 24 24" fill={t.textMuted}
              style={{ transform:locationOpen?"rotate(180deg)":"none", transition:"transform .2s" }}>
              <path d={P.down}/>
            </svg>
          </div>
          {locationOpen && (
            <div onClick={e=>e.stopPropagation()}
              style={{ position:"absolute", top:36, left:0, background:t.surface,
                border:`1px solid ${t.border}`, borderRadius:12, zIndex:40, minWidth:140,
                boxShadow:"0 4px 20px rgba(0,0,0,.18)", animation:"popIn .12s ease",
                overflow:"hidden" }}>
              {LOCATIONS.map(loc => (
                <div key={loc} onClick={() => { setActiveLocation(loc); setLocationOpen(false); }}
                  style={{ padding:"11px 16px", fontSize:13, cursor:"pointer",
                    background: loc===activeLocation ? t.primaryDim : "transparent",
                    color: loc===activeLocation ? t.primary : t.text,
                    display:"flex", alignItems:"center", gap:8,
                    borderBottom:`1px solid ${t.divider}30` }}>
                  {loc===activeLocation && <Ico name="check" size={14} color={t.primary}/>}
                  {loc!==activeLocation && <span style={{width:14}}/>}
                  <span style={{ fontWeight: loc===activeLocation ? 600 : 400 }}>{loc}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Filters button (opens bottom sheet) — placed right of Main location */}
        <div onClick={openSheet}
          style={{ display:"flex", alignItems:"center", gap:4,
            padding:"6px 11px", borderRadius:20, cursor:"pointer", flexShrink:0,
            background: appliedCount>0 ? t.primaryDim : t.chipBg,
            border: appliedCount>0 ? `1.5px solid ${t.primary}` : `1px dashed ${t.border}` }}>
          <Ico name="filter" size={13} color={appliedCount>0?t.primary:t.textMuted}/>
          <span style={{ fontSize:12, fontWeight:600, color:appliedCount>0?t.primary:t.chipFg }}>Filters</span>
          {appliedCount>0 && (

              borderRadius:10, fontSize:10, fontWeight:700, padding:"1px 6px" }}>
              {appliedCount}
            </span>
          )}
        </div>

        {/* Find by Photo */}
        <button onClick={() => showToast("Find by photo")}
          style={{ width:40, height:40, borderRadius:20, background:"none",
            border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
          <Ico name="imgSrch" size={22} color={t.textMuted}/>
        </button>

        {/* Sort button */}
        <div style={{ position:"relative" }}>
          <button onClick={e=>{e.stopPropagation();setSortOpen(o=>!o);}}
            style={{ width:40, height:40, borderRadius:20, background:"none",
              border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
            <Ico name="sort" size={22} color={sortOpen ? t.primary : t.textMuted}/>
          </button>
          {sortOpen && (
            <div onClick={e=>e.stopPropagation()}
              style={{ position:"absolute", top:44, right:0, background:t.surface,
                borderRadius:12, border:`1px solid ${t.border}`, overflow:"hidden",
                zIndex:30, minWidth:164,
                boxShadow: isDark ? "0 4px 20px rgba(0,0,0,.5)" : "0 4px 20px rgba(0,0,0,.12)",
                animation:"popIn .15s ease" }}>
              {SORT_OPTIONS.map(opt => (
                <div key={opt.key} onClick={() => { setSortBy(opt.key); setSortOpen(false); }}
                  style={{ padding:"11px 16px", fontSize:13, fontWeight:600,
                    background: sortBy===opt.key ? t.primaryDim : "transparent",
                    color: sortBy===opt.key ? t.primary : t.text,
                    cursor:"pointer", display:"flex", alignItems:"center", gap:8,
                    borderBottom:`1px solid ${t.divider}30` }}>
                  {sortBy===opt.key
                    ? <Ico name="check" size={14} color={t.primary}/>
                    : <span style={{width:14}}/>}
                  {opt.label}
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Settings icon */}
        <button onClick={() => showToast("Settings")}
          style={{ width:40, height:40, borderRadius:20, background:"none",
            border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
          <Ico name="settings" size={22} color={t.textMuted}/>
        </button>
      </div>

      {/* ── Quick category chip row (Outfits-style) ── */}
      {(() => {
        const QUICK_CATS = [
          { key: null,           label: "All" },
          { key: "tops",         label: "Tops" },
          { key: "bottoms",      label: "Bottoms" },
          { key: "outerwear",    label: "Outerwear" },
          { key: "footwear",     label: "Footwear" },
          { key: "accessories",  label: "Accessories" },
          { key: "dress",        label: "Dresses" },
        ];
        const activeCatSet = appliedFilters.Category || new Set();
        // "All" is active when no category is selected.
        const allActive = activeCatSet.size === 0;
        const setQuickCat = (key) => {
          setAppliedFilters(prev => {
            const next = { ...prev };
            if (key === null) { delete next.Category; return next; }
            // Toggle: if it's the only one set already, clear; else replace selection with this one.
            const cur = next.Category || new Set();
            if (cur.size === 1 && cur.has(key)) { delete next.Category; }
            else { next.Category = new Set([key]); }
            return next;
          });
        };
        const counts = React.useMemo(() => {
          const m = {};
          for (const it of ALL_ITEMS) m[it.category] = (m[it.category]||0) + 1;
          return m;
        }, []);
        return (
          <div style={{ padding:"6px 12px 6px", background:t.surface, flexShrink:0,
            display:"flex", gap:6, overflowX:"auto", scrollbarWidth:"none",
            borderBottom:`1px solid ${t.divider}40`, alignItems:"center" }}>
            {QUICK_CATS.map(c => {
              const active = c.key === null ? allActive : activeCatSet.has(c.key);
              const n = c.key === null ? ALL_ITEMS.length : (counts[c.key] || 0);
              return (
                <div key={c.label} onClick={() => setQuickCat(c.key)}
                  style={{ display:"flex", alignItems:"center", gap:5, flexShrink:0,
                    padding:"5px 11px", borderRadius:18, cursor:"pointer",
                    background: active ? t.primary : t.chipBg,
                    border: active ? `1.5px solid ${t.primary}` : `1px solid ${t.border}`,
                    color: active ? t.fabFg : t.chipFg,
                    fontSize:12, fontWeight:600, transition:"all .15s ease" }}>
                  <span>{c.label}</span>
                  <span style={{ fontSize:10, fontWeight:700, opacity: active ? 0.85 : 0.6 }}>
                    {n}
                  </span>
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* ── Active filter pills strip ── */}
      {appliedCount > 0 && (
        <div style={{ padding:"6px 14px 5px", background:t.primaryDim, flexShrink:0,
          display:"flex", gap:6, overflowX:"auto", scrollbarWidth:"none",
          borderBottom:`1px solid ${t.primary}30`, alignItems:"center" }}>
          <span style={{ fontSize:11, fontWeight:600, color:t.primary, flexShrink:0 }}>Active:</span>
          {Object.entries(appliedFilters).flatMap(([dim,vals])=>
            [...vals].map(val=>(
              <div key={dim+val} onClick={()=>removeApplied(dim,val)}

                <span style={{ fontSize:12, fontWeight:600, color:t.primary }}>{val}</span>
                <Ico name="close" size={12} color={t.primary}/>
              </div>
            ))
          )}
        </div>
      )}

      {/* ── Item count / Selection bar ── */}
      <div style={{ padding:"3px 12px 2px", background:t.bg, flexShrink:0,
        display:"flex", alignItems:"center", minHeight:28 }}>
        {selectionMode ? (
          <>
            <span style={{ fontSize:12, color:t.textMuted, flex:1, fontWeight:500 }}>
              {selected.size} selected
            </span>
            {displayedImages.some(i => !selected.has(i.id)) && (
              <button onClick={() => setSelected(new Set(displayedImages.map(i=>i.id)))}
                style={{ background:"none", border:"none", fontSize:12, fontWeight:600,
                  color:t.primary, cursor:"pointer", padding:"2px 8px" }}>
                Select all ({displayedImages.length})
              </button>
            )}
            <button onClick={() => setSelected(new Set())}
              style={{ background:"none", border:"none", fontSize:12, fontWeight:600,
                color:t.textMuted, cursor:"pointer", padding:"2px 8px" }}>
              Deselect all
            </button>
          </>
        ) : (
          <span style={{ fontSize:11, color:t.textMuted, fontWeight:500 }}>
            {hasFilter
              ? `${displayedImages.length} of ${ALL_ITEMS.length} items`
              : `${ALL_ITEMS.length} items`}
          </span>
        )}
      </div>

      {/* ── Sync progress bar ── */}
      {syncProgress && (
        <div style={{ flexShrink:0, background:t.bg }}>
          <div style={{ height:3, background:t.progressBg, overflow:"hidden" }}>
            <div style={{ height:"100%", background:t.progressFg, borderRadius:2,
              width:`${(syncProgress.done/syncProgress.total)*100}%`, transition:"width .3s" }}/>
          </div>
          <span style={{ fontSize:10, color:t.textMuted, padding:"1px 12px", display:"block" }}>
            Syncing {syncProgress.done} / {syncProgress.total}
          </span>
        </div>
      )}

      {/* ── Grid ── */}
      <div ref={gridRef}
        style={{ flex:1, overflowY:"auto", padding:"2px 2px 90px",
          display:"grid",
          gridTemplateColumns:`repeat(${cols},1fr)`,
          gap:1, alignContent:"start", scrollbarWidth:"none" }}>

        {displayedImages.length === 0 ? (
          <div style={{ gridColumn:"1/-1", display:"flex", flexDirection:"column",
            alignItems:"center", justifyContent:"center", gap:8, padding:"60px 20px",
            color:t.textMuted }}>
            <Ico name="wardrobe" size={40} color={t.border}/>
            <span style={{ fontSize:15, fontWeight:600 }}>
              {hasFilter ? "No items match filters" : "Your wardrobe is empty"}
            </span>
            {hasFilter && (
              <button onClick={clearFilters}
                style={{ background:t.primaryDim, border:"none", borderRadius:20,
                  padding:"8px 18px", fontSize:13, fontWeight:600, color:t.primary, cursor:"pointer" }}>
                Clear filters
              </button>
            )}
          </div>
        ) : displayedImages.map(item => {
          const color = swatches[item.swIdx % swatches.length];
          const isSel = selected.has(item.id);
          const hasLabel = !!item.label;
          const showLocBadge = multiCloset && item.location;

          return (
            <div key={item.id}
              onClick={() => toggleItem(item.id)}
              style={{ position:"relative", cursor:"pointer",
                background: isSel ? t.surface2 : t.surface,
                outline: isSel ? `2px solid ${t.selBorder}` : "none",
                outlineOffset:-1 }}>
              {/* Square image area */}
              <div style={{ position:"relative", width:"100%", paddingBottom:"100%" }}>
                <div style={{ position:"absolute", inset:0 }}>
                  <GarmentTile color={color} pending={item.pending} isDark={isDark}/>
                  {/* Selection overlay */}
                  {isSel && (
                    <div style={{ position:"absolute", inset:0,
                      background:t.selOverlay,
                      display:"flex", alignItems:"flex-start", justifyContent:"flex-end",
                      padding:4 }}>
                      <div style={{ color:t.selCheck }}>
                        <Ico name="checkCircle" size={18} color={t.selCheck}/>
                      </div>
                    </div>
                  )}
                  {/* Location badge (top-right, only when multi-closet) */}
                  {showLocBadge && !isSel && (
                    <div style={{ position:"absolute", top:3, right:3,
                      background:"rgba(0,0,0,0.45)", borderRadius:4,
                      padding:"1px 4px" }}>
                      <span style={{ fontSize:8, color:"#fff", fontWeight:500,
                        maxWidth:50, overflow:"hidden", textOverflow:"ellipsis",
                        whiteSpace:"nowrap", display:"block" }}>
                        {item.location}
                      </span>
                    </div>
                  )}
                </div>
              </div>
              {/* Label (shown when item has a tags.label) */}
              {hasLabel && (
                <div style={{ padding:"2px 4px 3px", background:t.surface }}>
                  <div style={{ fontSize:10, fontWeight:600, color:t.text,
                    whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                    {item.label}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ── FABs: Selection mode — speed-dial column ── */}
      {selectionMode && !isOffline && (
        <div style={{ position:"absolute", bottom:84, right:16,
          display:"flex", flexDirection:"column", gap:8, alignItems:"flex-end", zIndex:10 }}>
          <div onClick={()=>{ showToast("Create style"); setSelected(new Set()); }}
            style={{ display:"flex", alignItems:"center", gap:8,
              background:t.primaryDim, border:`1px solid ${t.primary}`, borderRadius:28,
              padding:"11px 16px", cursor:"pointer",
              boxShadow: isDark?"0 4px 16px rgba(0,0,0,.5)":"0 4px 16px rgba(78,120,68,.2)" }}>
            <Ico name="autofix" size={17} color={t.primary}/>
            <span style={{ fontSize:13, fontWeight:700, color:t.primary }}>Create style</span>
          </div>
          <div onClick={()=>{ showToast("Suggest replacements"); setSelected(new Set()); }}
            style={{ display:"flex", alignItems:"center", gap:8,
              background:t.primaryDim, border:`1px solid ${t.primary}`, borderRadius:28,
              padding:"11px 16px", cursor:"pointer",
              boxShadow: isDark?"0 4px 16px rgba(0,0,0,.5)":"0 4px 16px rgba(78,120,68,.2)" }}>
            <Ico name="swapHoriz" size={17} color={t.primary}/>
            <span style={{ fontSize:13, fontWeight:700, color:t.primary }}>Suggest replacements</span>
          </div>
          {multiCloset && (
            <div onClick={()=>{ showToast("Move to closet"); setSelected(new Set()); }}
              style={{ display:"flex", alignItems:"center", gap:8,
                background:t.chipBg, border:`1px solid ${t.border}`, borderRadius:28,
                padding:"11px 16px", cursor:"pointer" }}>
              <Ico name="place" size={17} color={t.textMid}/>
              <span style={{ fontSize:13, fontWeight:700, color:t.textMid }}>Move to</span>
            </div>
          )}
          <div onClick={()=>{ showToast("Delete selected"); setSelected(new Set()); }}
            style={{ display:"flex", alignItems:"center", gap:8,
              background:t.error+"22", border:`1px solid ${t.error}`, borderRadius:28,
              padding:"11px 16px", cursor:"pointer" }}>
            <Ico name="delete" size={17} color={t.error}/>
            <span style={{ fontSize:13, fontWeight:700, color:t.error }}>Delete</span>
          </div>
        </div>
      )}

      {/* ── FABs: Default mode — + FAB (opens camera) with speed-dial ── */}
      {/* Single circular + FAB — matches FloatingActionButton + Icons.Default.Add */}
      {!selectionMode && !isOffline && (
        <button
          onClick={e => { e.stopPropagation(); showToast("Open camera"); }}
          style={{ position:"absolute", bottom:84, right:16,
            width:56, height:56, borderRadius:16,
            background:t.fabBg, border:"none",
            display:"flex", alignItems:"center", justifyContent:"center",
            boxShadow: isDark?"0 6px 20px rgba(0,0,0,.5)":"0 6px 20px rgba(0,0,0,.15)",
            cursor:"pointer", zIndex:10 }}>
          <Ico name="add" size={26} color={t.fabFg}/>
        </button>
      )}

      {/* ── Bottom nav ── */}
      <div style={{ height:72, background:t.navBg, flexShrink:0,
        borderTop:`1px solid ${t.divider}`,
        display:"flex", alignItems:"center", paddingBottom:6, zIndex:5 }}>
        {[
          { i:"style",    l:"Outfits"  },
          { i:"wardrobe", l:"Wardrobe" },
          { i:"shopping", l:"Shopping" },
          { i:"flight",   l:"Travel"   },
          { i:"insights", l:"Insights" },
        ].map((tab, idx) => {
          const active = idx === 1;
          return (
            <div key={idx} style={{ flex:1, display:"flex", flexDirection:"column",
              alignItems:"center", gap:3, paddingTop:8, cursor:"pointer" }}
              onClick={() => showToast(tab.l)}>
              {active
                ? <div style={{ background:t.navIndicator, borderRadius:16,
                    padding:"4px 20px", marginBottom:2 }}>
                    <Ico name={tab.i} size={22} color={t.primary}/>
                  </div>
                : <Ico name={tab.i} size={22} color={t.textMuted}/>}
              <span style={{ fontSize:10, fontWeight:active?700:500,
                color:active?t.primary:t.textMuted }}>{tab.l}</span>
            </div>
          );
        })}
      </div>

      {/* ── Toast ── */}
      {toast && <Toast t={t} msg={toast} onDone={() => setToast(null)}/>}

      {/* ── Filter sheet backdrop ── */}
      {filterOpen && (
        <div onClick={()=>setFilterOpen(false)}
          style={{ position:"absolute", inset:0, background:"rgba(0,0,0,.35)", zIndex:20,
            animation:"fadeIn .2s ease" }}/>
      )}

      {/* ── Filter sheet ── */}
      {filterOpen && (
        <div style={{ position:"absolute", bottom:0, left:0, right:0,
          background:t.sheetBg, borderRadius:"24px 24px 0 0", zIndex:25,
          maxHeight:"78%", display:"flex", flexDirection:"column",
          animation:"sheetUp .28s cubic-bezier(.32,0,.67,0)",
          boxShadow:"0 -8px 32px rgba(0,0,0,.2)" }}>
          {/* handle */}
          <div style={{ display:"flex", justifyContent:"center", padding:"12px 0 4px" }}>
            <div style={{ width:36, height:4, borderRadius:2, background:t.border }}/>
          </div>
          {/* sheet header */}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
            padding:"4px 20px 12px", borderBottom:`1px solid ${t.divider}`, flexShrink:0 }}>
            <span style={{ fontSize:18, fontWeight:700 }}>Filter wardrobe</span>
            <div style={{ display:"flex", gap:12, alignItems:"center" }}>
              <button onClick={clearFilters}
                style={{ background:"none", border:"none", fontSize:13, fontWeight:600,
                  color:t.textMuted, cursor:"pointer" }}>Clear all</button>
              <button onClick={applyFilters}
                style={{ background:t.fabBg, color:t.fabFg, border:"none",
                  borderRadius:20, padding:"8px 18px", fontSize:13, fontWeight:700, cursor:"pointer" }}>
                Apply
              </button>
            </div>
          </div>
          {/* scrollable dimension list */}
          <div style={{ overflowY:"auto", scrollbarWidth:"none" }}>
            {DIMS.map(dim => {
              const pending = pendingFilters[dim.key] || new Set();
              const isOpen = openDim === dim.key;
              const activeCount = pending.size;
              return (
                <div key={dim.key} style={{ borderBottom:`1px solid ${t.divider}` }}>
                  <div onClick={()=>setOpenDim(isOpen ? null : dim.key)}
                    style={{ display:"flex", justifyContent:"space-between",
                      alignItems:"center", padding:"13px 20px", cursor:"pointer" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:14, fontWeight:700 }}>{dim.key}</span>
                      {activeCount > 0 && (
                        <span style={{ background:t.primary, color:t.fabFg,
                          borderRadius:10, fontSize:10, fontWeight:700, padding:"1px 7px" }}>
                          {activeCount}
                        </span>
                      )}
                    </div>
                    <svg width={18} height={18} viewBox="0 0 24 24" fill={t.textMuted}
                      style={{ transform:isOpen?"rotate(180deg)":"none", transition:"transform .2s" }}>
                      <path d={P.down}/>
                    </svg>
                  </div>
                  {isOpen && (
                    <div style={{ padding:"0 16px 14px", display:"flex",
                      gap:7, flexWrap:"wrap", animation:"fadeIn .15s ease" }}>
                      {dim.colors ? (
                        dim.values.map((val,i)=>{
                          const active = pending.has(val);
                          return (
                            <div key={val} onClick={()=>togglePending(dim.key, val)}
                              style={{ display:"flex", flexDirection:"column",
                                alignItems:"center", gap:5, cursor:"pointer" }}>
                              <div style={{ width:34, height:34, borderRadius:17,
                                background:dim.colors[i],
                                border:`2.5px solid ${active?t.primary:t.border}`,
                                boxShadow:active?`0 0 0 3px ${t.primaryDim}`:"none",
                                transition:"border-color .15s, box-shadow .15s" }}/>
                              <span style={{ fontSize:10, color:t.textMuted }}>{val}</span>
                            </div>
                          );
                        })
                      ) : (
                        dim.values.map(val=>{
                          const active = pending.has(val);
                          return (
                            <div key={val} onClick={()=>togglePending(dim.key, val)}
                              style={{ display:"inline-flex", alignItems:"center",
                                padding:"6px 13px", borderRadius:20, cursor:"pointer",
                                background: active ? t.chipABg : t.chipBg,
                                border: active ? "none" : `1px dashed ${t.border}`,
                                transition:"background .12s" }}>
                              <span style={{ fontSize:13, fontWeight:600,
                                color:active?t.chipAFg:t.chipFg }}>{val}</span>
                            </div>
                          );
                        })
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            <div style={{ height:16 }}/>
          </div>
        </div>
      )}

    </div>
  );
};

// ── Root with tweaks ──────────────────────────────────────────────────────────
const App = () => {
  const [tweaks, setTweak] = useTweaks(/*EDITMODE-BEGIN*/{
    "theme": "green-light",
    "offline": false,
    "multiCloset": false
  }/*EDITMODE-END*/);

  return (
    <>
      <WardrobeApp
        theme={tweaks.theme}
        isOffline={tweaks.offline}
        multiCloset={tweaks.multiCloset}
      />
      <TweaksPanel>
        <TweakSection title="Theme">
          <TweakSelect id="theme" label="Color theme"
            options={["green-light","green-dark","sand-light","indigo-dark","pastel-mint","pastel-blush","pastel-lavender","pastel-butter","pastel-sky"]}
            value={tweaks.theme} onChange={v => setTweak("theme", v)}/>
        </TweakSection>
        <TweakSection title="State">
          <TweakToggle id="offline" label="Offline mode"
            value={tweaks.offline} onChange={v => setTweak("offline", v)}/>
          <TweakToggle id="multiCloset" label="Multi-closet"
            value={tweaks.multiCloset} onChange={v => setTweak("multiCloset", v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
