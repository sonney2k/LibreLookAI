android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.configuration-cache=true
# JDK 21 (Homebrew) for the Robolectric unit-test toolchain — Robolectric can't instrument
# under the machine-default JDK 25. Declared explicitly so Gradle detects it locally and
# never falls back to the (Gradle-9-incompatible) foojay auto-download path.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
